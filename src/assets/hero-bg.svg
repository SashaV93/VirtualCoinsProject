<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="45%" stop-color="#0d1b3a"/>
      <stop offset="100%" stop-color="#1b1035"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0b90b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f0b90b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="coinFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd75e"/>
      <stop offset="100%" stop-color="#c98a06"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <circle cx="1180" cy="250" r="480" fill="url(#glowGold)"/>
  <circle cx="300" cy="700" r="420" fill="url(#glowCyan)"/>

  <!-- market line -->
  <path d="M0 690 L120 660 L220 705 L330 600 L440 640 L560 520 L680 575 L800 455 L920 500 L1040 380 L1160 430 L1290 300 L1420 350 L1600 210"
        fill="none" stroke="#16c784" stroke-opacity="0.65" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M0 690 L120 660 L220 705 L330 600 L440 640 L560 520 L680 575 L800 455 L920 500 L1040 380 L1160 430 L1290 300 L1420 350 L1600 210 L1600 900 L0 900 Z"
        fill="#16c784" fill-opacity="0.07"/>

  <!-- floating coins -->
  <g opacity="0.9">
    <circle cx="1200" cy="230" r="96" fill="url(#coinFace)"/>
    <circle cx="1200" cy="230" r="96" fill="none" stroke="#8a5f00" stroke-width="5"/>
    <text x="1200" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="112" font-weight="700"
          fill="#4a3300" text-anchor="middle">&#8383;</text>
  </g>
  <g opacity="0.75">
    <circle cx="330" cy="300" r="58" fill="#8f9ff3"/>
    <circle cx="330" cy="300" r="58" fill="none" stroke="#3f4a99" stroke-width="4"/>
    <text x="330" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700"
          fill="#1e2454" text-anchor="middle">&#926;</text>
  </g>
  <g opacity="0.6">
    <circle cx="760" cy="180" r="40" fill="#c3a634"/>
    <circle cx="760" cy="180" r="40" fill="none" stroke="#6d5c15" stroke-width="3"/>
    <text x="760" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700"
          fill="#3a3009" text-anchor="middle">D</text>
  </g>

  <!-- specks -->
  <g fill="#e2e8f0" opacity="0.5">
    <circle cx="120" cy="120" r="2"/><circle cx="480" cy="90" r="1.6"/><circle cx="930" cy="130" r="2.2"/>
    <circle cx="1450" cy="120" r="1.8"/><circle cx="640" cy="300" r="1.5"/><circle cx="1520" cy="520" r="2"/>
    <circle cx="80" cy="460" r="1.7"/><circle cx="1010" cy="640" r="1.5"/><circle cx="1350" cy="700" r="2"/>
  </g>
</svg>
